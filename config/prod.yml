env: prod
http:
  host: 0.0.0.0
  port: 8000
grpc:
  enabled: true        # 置 false 则不启动 gRPC 服务（不占端口、不实例化）
  host: 0.0.0.0
  port: 9500
security:
  jwt:
    key: change-me-in-production
data:
  db:
    driver: mysql
    dsn: root:123456@tcp(127.0.0.1:3306)/do_template?charset=utf8mb4&parseTime=True&loc=Local
  redis:
    addr: redis:6379
    password: ""
    db: 0
    read_timeout: 200ms
    write_timeout: 200ms
log:
  level: info
  mode: file
  file: storage/logs/server.log
