syntax = "proto3";

package userv1;

option go_package = "do-template-api/api/pb/userv1;userv1";

message GetProfileRequest {
  string user_id = 1;
}

message Profile {
  string user_id = 1;
  string nickname = 2;
}

// 长连接演示：服务端按 interval_ms 推送 count 次 Heartbeat
message SubscribeHeartbeatRequest {
  int64 interval_ms = 1;
  int32 count = 2;
}

message Heartbeat {
  int64 seq = 1;
  int64 timestamp = 2;
}

service UserService {
  rpc GetProfile(GetProfileRequest) returns (Profile);
  rpc SubscribeHeartbeat(SubscribeHeartbeatRequest) returns (stream Heartbeat);
}
